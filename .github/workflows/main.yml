name: Tailscale Exit Node Test

on:
  workflow_dispatch:

jobs:
  exit-node:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check system
        run: |
          whoami
          uname -a
          echo "=== TUN ==="
          ls -l /dev/net/tun || true
          echo "=== IP forwarding ==="
          cat /proc/sys/net/ipv4/ip_forward
          echo "=== IP ==="
          ip addr
          echo "=== Routes ==="
          ip route

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          tailscale version

      - name: Connect as Exit Node
        run: |
          sudo tailscale up \
            --auth-key="${{ secrets.TS_AUTHKEY }}" \
            --hostname="github-actions-exit-node" \
            --advertise-exit-node

      - name: Show Tailscale status
        run: |
          tailscale status
          echo "=== Tailscale IP ==="
          tailscale ip

      - name: Show advertised routes
        run: |
          tailscale debug prefs

      - name: Test Internet
        run: |
          echo "Public IP:"
          curl -4 https://ifconfig.me
          echo

      - name: Keep Exit Node alive
        run: |
          echo "Exit Node is running..."
          echo "Stop the workflow to destroy the temporary Exit Node."
          sleep 21600
