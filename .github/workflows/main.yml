
name: Test Unreal Engine 5.8 with Wine Headless

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-unreal:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Install Wine, Xvfb and 7-Zip
        shell: bash
        run: |
          set -e

          sudo dpkg --add-architecture i386
          sudo apt-get update

          sudo apt-get install -y \
            wine \
            wine64 \
            winbind \
            xvfb \
            p7zip-full

          wine --version
          7z

      - name: Check disk space
        shell: bash
        run: |
          df -h
          free -h

      - name: Download Unreal Engine Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/ue-parts"

          gh release download ue5.8 \
            --repo forgotenmywin/Windows_with_no_vnc \
            --pattern 'UE_5.8.zip.*' \
            --dir "$RUNNER_TEMP/ue-parts"

          echo "Downloaded files:"
          ls -lh "$RUNNER_TEMP/ue-parts"

          if [ ! -f "$RUNNER_TEMP/ue-parts/UE_5.8.zip.001" ]; then
            echo "ERROR: First archive part not found."
            exit 1
          fi

      - name: Verify archive parts
        shell: bash
        run: |
          set -e

          echo "Archive part count:"
          find "$RUNNER_TEMP/ue-parts" \
            -maxdepth 1 -type f | wc -l

          echo "Archive total size:"
          du -sh "$RUNNER_TEMP/ue-parts"

          df -h "$RUNNER_TEMP"

      - name: Extract Unreal Engine
        shell: bash
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/ue"

          7z x \
            "$RUNNER_TEMP/ue-parts/UE_5.8.zip.001" \
            "-o$RUNNER_TEMP/ue" \
            -y

          echo "Searching for UnrealEditor.exe..."

          find "$RUNNER_TEMP/ue" \
            -type f \
            -iname 'UnrealEditor.exe' \
            -print

          df -h "$RUNNER_TEMP"

      - name: Initialize Wine
        shell: bash
        run: |
          set -e

          export WINEPREFIX="$RUNNER_TEMP/wineprefix"
          export WINEARCH=win64
          export WINEDEBUG=-all

          xvfb-run -a wineboot --init

          wine --version
          echo "Wine initialized."

      - name: Test Unreal Engine without rendering
        shell: bash
        run: |
          set -u

          EDITOR="$(find "$RUNNER_TEMP/ue" \
            -type f \
            -iname 'UnrealEditor.exe' \
            -print -quit)"

          if [ -z "$EDITOR" ]; then
            echo "ERROR: UnrealEditor.exe not found."
            exit 1
          fi

          echo "Editor path: $EDITOR"

          export WINEPREFIX="$RUNNER_TEMP/wineprefix"
          export WINEARCH=win64
          export WINEDEBUG=-all

          mkdir -p "$RUNNER_TEMP/ue-logs"

          cd "$(dirname "$EDITOR")"

          set +e

          timeout 600s xvfb-run -a wine "$EDITOR" \
            -nullrhi \
            -unattended \
            -nop4 \
            -nosplash \
            -log \
            '-ExecCmds=Quit' \
            > "$RUNNER_TEMP/ue-logs/unreal.log" 2>&1

          RC=$?

          set -e

          echo "Exit code: $RC"
          echo "Last 200 log lines:"
          tail -n 200 "$RUNNER_TEMP/ue-logs/unreal.log"

          if [ "$RC" -eq 0 ]; then
            echo "Unreal process exited with code 0."
          elif [ "$RC" -eq 124 ]; then
            echo "Unreal timed out after 10 minutes."
          else
            echo "Unreal exited with an error."
          fi

          exit "$RC"

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unreal-wine-test-logs
          path: ${{ runner.temp }}/ue-logs/
          if-no-files-found: warn
